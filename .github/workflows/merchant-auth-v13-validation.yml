name: Merchant Auth validation

on:
  push:
    branches: [main]
    paths:
      - 'functions/privlan-merchant-api/**'
      - 'tests/privlan-merchant-login/**'
      - 'archive/v12/index.ts'
      - 'source/DEPLOY_PATH.md'
      - 'DEPLOYMENT.md'
      - '.github/workflows/merchant-auth-v13-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'functions/privlan-merchant-api/**'
      - 'tests/privlan-merchant-login/**'
      - 'archive/v12/index.ts'
      - 'source/DEPLOY_PATH.md'
      - 'DEPLOYMENT.md'
      - '.github/workflows/merchant-auth-v13-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Set up pnpm 11.7.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Set up Deno 2.9.2
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.2
      - name: Prepare POSIX harness root
        shell: bash
        run: |
          set -euo pipefail
          sudo -n install -d -o "$(id -u)" -g "$(id -g)" /home/project
          cp -a ./. /home/project/
          cd /home/project
          cat > package.json <<'JSON'
          {"name":"feeldao-merchant-auth-ci","private":true,"packageManager":"pnpm@11.7.0","devDependencies":{"typescript":"5.9.3"}}
          JSON
          test -f functions/privlan-merchant-api/index.ts
          test -f tests/privlan-merchant-login/build.mjs
          grep -Fq 'const ROOT = "/home/project";' tests/privlan-merchant-login/build.mjs
      - name: Verify source and V12 rollback identities
        shell: bash
        run: |
          set -euo pipefail
          cd /home/project
          source_sha=$(sha256sum functions/privlan-merchant-api/index.ts | awk '{print $1}')
          v12_sha=$(sha256sum archive/v12/index.ts | awk '{print $1}')
          test "$v12_sha" = 0010ca398495fb2e06ae5b6b13032f241ef80dbed1c342fcd0d4ec2301defa55
          test "$(grep -oF 'https://esm.sh/@supabase/supabase-js@2.115.0' functions/privlan-merchant-api/index.ts | wc -l)" -ge 1
          test "$(grep -oE '@supabase/supabase-js@2([^.]|$)' functions/privlan-merchant-api/index.ts | wc -l)" = 0
          printf 'FUNCTION_SOURCE_SHA=%s\nV12_ROLLBACK_SHA=%s\n' "$source_sha" "$v12_sha"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd /home/project
          pnpm install
          test -x node_modules/typescript/bin/tsc
          test "$(node -p "process.versions.node.split('.')[0]")" = 22
      - name: Build and test Merchant Auth
        shell: bash
        run: |
          set -euo pipefail
          cd /home/project
          node tests/privlan-merchant-login/build.mjs
          node --test tests/privlan-merchant-login/*.test.mjs | tee /tmp/merchant-auth-tests.log
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/merchant-auth-tests.log', 'utf8');
          const get = (key) => Number((text.match(new RegExp('^# ' + key + ' (\\d+)$', 'm')) || [])[1]);
          const total = get('tests'); const pass = get('pass'); const fail = get('fail');
          if (!total || pass !== total || fail !== 0) throw new Error(`unexpected test counts ${total}/${pass}/${fail}`);
          console.log(`FUNCTION_TESTS_TOTAL=${total}`); console.log('MERCHANT_AUTH_TESTS=PASS');
          NODE
      - name: Deno dependency check
        shell: bash
        run: |
          set -euo pipefail
          cd /home/project
          deno check --no-lock --reload functions/privlan-merchant-api/index.ts